<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal RRHH - SIMECAR</title>
<link rel="icon" href="logo.png" type="image/png">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;}
.fade-in{animation:fadeIn 0.5s ease-in-out;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-200 transition-colors duration-300" oncontextmenu="return false;">
<div id="pantallaLogin" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900 p-4 relative">
<div class="bg-white/10 backdrop-blur-lg p-8 rounded-2xl shadow-2xl border border-white/20 w-full max-w-md fade-in">
<div class="text-center mb-8">
<div class="bg-white p-4 rounded-2xl shadow-xl inline-block mb-4">
<img src="logo.png" alt="Logo SIMECAR" class="h-24 w-auto object-contain">
</div>
<h2 class="text-3xl font-bold text-white tracking-tight">Acceso Restringido</h2>
<p class="text-slate-300 mt-2 text-sm">Portal exclusivo de Recursos Humanos</p>
</div>
<form id="formLogin" class="space-y-5">
<div>
<label class="block text-sm font-medium text-slate-300 mb-1">Correo de Usuario</label>
<input type="email" id="inputUsuario" required class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" placeholder="ejemplo@simecar.com">
</div>
<div>
<label class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label>
<input type="password" id="inputPassword" required class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" placeholder="••••••••">
</div>
<div id="mensajeError" class="text-red-400 text-sm text-center hidden font-medium bg-red-900/30 py-2 rounded">
Credenciales incorrectas o usuario no existe.
</div>
<button type="submit" id="btnIngresar" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-all transform hover:-translate-y-0.5 mt-2 flex justify-center items-center">
<span id="btnTexto">Ingresar al Sistema</span>
</button>
</form>
</div>
</div>
<div id="pantallaDashboard" class="hidden">
<nav class="bg-white dark:bg-slate-800 shadow-sm border-b border-slate-200 dark:border-slate-700 sticky top-0 z-10 transition-colors duration-300">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex justify-between h-20 items-center">
<div class="flex items-center gap-4">
<img src="logo.png" alt="Logo SIMECAR" class="h-10 md:h-10 w-auto object-contain drop-shadow-sm">
<div>
<p class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-widest font-semibold">Portal RRHH</p>
</div>
</div>
<div class="flex items-center gap-4">
<button onclick="toggleTema()" class="p-2 bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 rounded-full hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
<svg id="iconoSol" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
<svg id="iconoLuna" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
</button>
<span class="text-sm font-medium text-slate-500 dark:text-slate-400 flex items-center gap-2 hidden sm:flex">
<span class="w-2 h-2 rounded-full bg-green-500"></span> Sesión Segura
</span>
<button onclick="cerrarSesion()" class="text-sm text-slate-500 dark:text-slate-400 hover:text-red-600 dark:hover:text-red-400 font-medium transition-colors">Cerrar Sesión</button>
</div>
</div>
</div>
</nav>
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 fade-in">
<div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-4">
<div>
<h2 class="text-2xl font-bold text-slate-800 dark:text-white">CONTROL DE ASISTENCIA</h2>
<p class="text-slate-500 dark:text-slate-400 mt-1">Historial completo de asignación y control de equipos.</p>
<p id="contadorRegistros" class="text-sm font-bold text-blue-600 dark:text-blue-400 mt-2 bg-blue-50 dark:bg-blue-900/30 inline-block px-3 py-1 rounded-full"></p>
</div>
<div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
<div class="flex items-center bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg overflow-hidden shadow-sm transition-colors duration-300 w-full sm:w-auto">
<span class="pl-3 text-slate-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
</span>
<input type="date" id="inputFiltroFecha" onchange="cargarRegistros()" class="px-3 py-2 bg-transparent text-sm text-slate-700 dark:text-slate-200 focus:outline-none cursor-pointer w-full">
<button onclick="limpiarFiltro()" class="px-3 py-2 text-slate-400 hover:text-red-500 dark:hover:text-red-400 transition-colors">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
</button>
</div>
<button onclick="cargarRegistros()" class="bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 font-semibold py-2 px-4 rounded-lg shadow-sm transition-all flex items-center justify-center gap-2 text-sm w-full sm:w-auto">
<svg class="w-4 h-4 text-slate-500 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
Refrescar
</button>
</div>
</div>
<div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden transition-colors duration-300">
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse">
<thead>
<tr class="bg-slate-50 dark:bg-slate-700/50 border-b border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300 text-xs uppercase tracking-wider transition-colors duration-300">
<th class="p-5 font-semibold">Fecha y Registro</th>
<th class="p-5 font-semibold">Team Info</th>
<th class="p-5 font-semibold">Técnicos Asignados</th>
<th class="p-5 font-semibold text-center">Evidencia</th>
</tr>
</thead>
<tbody id="tablaBody" class="divide-y divide-slate-100 dark:divide-slate-700/50 text-sm">
</tbody>
</table>
</div>
</div>
</div>
</div>
<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.keyCode===123||(e.ctrlKey&&e.shiftKey&&(e.keyCode===73||e.keyCode===74))||(e.ctrlKey&&e.keyCode===85))e.preventDefault();});
function toggleTema(){document.documentElement.classList.toggle('dark');const e=document.documentElement.classList.contains('dark');document.getElementById('iconoSol').classList.toggle('hidden',!e);document.getElementById('iconoLuna').classList.toggle('hidden',e);localStorage.setItem('temaSimecar',e?'dark':'light');}
if(localStorage.getItem('temaSimecar')==='dark'||(!('temaSimecar' in localStorage)&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');document.getElementById('iconoSol').classList.remove('hidden');document.getElementById('iconoLuna').classList.add('hidden');}
const supabaseUrl='https://tdznomernindagzvmgxf.supabase.co';
const supabaseKey='sb_publishable_ZSrilY65_GHCV0iZyqYBHA_9QijZPN-';
const db=supabase.createClient(supabaseUrl,supabaseKey);
window.onload=async()=>{const{data:{session:e}}=await db.auth.getSession();if(e){document.getElementById('pantallaLogin').classList.add('hidden');document.getElementById('pantallaDashboard').classList.remove('hidden');cargarRegistros();}};
document.getElementById('formLogin').addEventListener('submit',async e=>{e.preventDefault();const t=document.getElementById('inputUsuario').value;const n=document.getElementById('inputPassword').value;const s=document.getElementById('mensajeError');const d=document.getElementById('btnTexto');d.innerHTML='<svg class="animate-spin h-5 w-5 mr-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Validando...';const{data:o,error:a}=await db.auth.signInWithPassword({email:t,password:n});if(a){s.classList.remove('hidden');d.innerText='Ingresar al Sistema';const e=document.querySelector('.backdrop-blur-lg');e.style.transform='translateX(-10px)';setTimeout(()=>e.style.transform='translateX(10px)',100);setTimeout(()=>e.style.transform='translateX(-10px)',200);setTimeout(()=>e.style.transform='translateX(0)',300);}else{s.classList.add('hidden');document.getElementById('pantallaLogin').classList.add('hidden');document.getElementById('pantallaDashboard').classList.remove('hidden');cargarRegistros();d.innerText='Ingresar al Sistema';}});
async function cerrarSesion(){await db.auth.signOut();document.getElementById('inputPassword').value='';document.getElementById('pantallaDashboard').classList.add('hidden');document.getElementById('pantallaLogin').classList.remove('hidden');}
function limpiarFiltro(){document.getElementById('inputFiltroFecha').value='';cargarRegistros();}
async function cargarRegistros(){const e=document.getElementById('tablaBody');const t=document.getElementById('contadorRegistros');const n=document.getElementById('inputFiltroFecha').value;e.innerHTML='<tr><td colspan="4" class="p-10 text-center text-slate-400 font-medium">Buscando en la base de datos...</td></tr>';t.innerText='Calculando...';try{let s=db.from('registros_epp').select('*').order('created_at',{ascending:false});if(n){s=s.eq('fecha',n);}const{data:d,error:o}=await s;if(o)throw o;t.innerText=`Mostrando ${d.length} ${d.length===1?'registro':'registros'}`;if(d.length===0){e.innerHTML='<tr><td colspan="4" class="p-10 text-center text-slate-400 italic">No se encontraron registros para esta fecha.</td></tr>';return;}e.innerHTML='';d.forEach(t=>{let n='<div class="space-y-2">';if(t.tecnicos&&t.tecnicos.length>0){t.tecnicos.forEach(e=>{const t=e.asistencia==='Asistió'?'<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-100 dark:bg-green-900/40 text-green-800 dark:text-green-400">Asistió</span>':'<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-100 dark:bg-red-900/40 text-red-800 dark:text-red-400">Faltó</span>';n+=`<div class="flex items-center justify-between bg-slate-50 dark:bg-slate-700/30 px-3 py-2 rounded-md border border-slate-100 dark:border-slate-600"><span class="font-medium text-slate-700 dark:text-slate-200">${e.nombre}</span> ${t}</div>`;});}n+='</div>';const s=t.lider_asistencia==='Asistió'?'<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 dark:bg-green-900/40 text-green-800 dark:text-green-400">Asistió</span>':'<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 dark:bg-red-900/40 text-red-800 dark:text-red-400">Faltó</span>';const d=`<tr class="hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors duration-200 group"><td class="p-5 align-top"><div class="font-bold text-slate-900 dark:text-white text-base">${t.fecha}</div><div class="text-slate-500 dark:text-slate-400 text-sm flex items-center gap-1 mt-1">${t.hora}</div></td><td class="p-5 align-top"><div class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wide font-semibold mb-1">Team ${t.numero_team}</div><div class="font-bold text-slate-800 dark:text-slate-200 mb-1 flex items-center gap-2">${t.lider_nombre}</div>${s}</td><td class="p-5 align-top min-w-[250px]">${n}</td><td class="p-5 align-middle text-center"><a href="${t.foto_url}" target="_blank" class="inline-flex items-center gap-2 bg-white dark:bg-slate-700 hover:bg-blue-50 dark:hover:bg-blue-900/40 border border-slate-200 dark:border-slate-600 hover:border-blue-200 dark:hover:border-blue-500 text-slate-700 dark:text-slate-200 hover:text-blue-700 dark:hover:text-blue-400 font-semibold py-2 px-4 rounded-lg shadow-sm transition-all group-hover:shadow text-sm">Ver Evidencia</a></td></tr>`;e.insertAdjacentHTML('beforeend',d);});}catch(e){t.innerHTML='<tr><td colspan="4" class="p-10 text-center bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 font-bold border border-red-100 dark:border-red-800/30 rounded-lg">❌ Error de conexión. No se pudieron cargar los datos.</td></tr>';}}
</script>
</body>
</html>
